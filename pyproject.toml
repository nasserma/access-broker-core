[project]
name = "access-broker-core"
version = "0.1.0"
description = "Shared security architecture for the access-broker suite: grant lifecycle, tier evaluation, hash-chained audit, transport auth, approval-gateway substrate."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Nasser Mohieddin Abukhdeir" }]

[project.urls]
# GitHub publication is the owner's separate task; URLs recorded at founding
# so the provenance chain (nextcloud-access-broker -> groupware-access-broker
# -> access-broker-core) is documented before the repo goes public.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["access_broker_core"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
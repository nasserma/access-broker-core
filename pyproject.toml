[project]
name = "access-broker-core"
version = "0.1.0"
description = "Shared security architecture for the access-broker suite: grant lifecycle, tier evaluation, hash-chained audit, transport auth, approval-gateway substrate."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Nasser Mohieddin Abukhdeir" }]

[project.urls]
# GitHub publication is the owner's separate task; URLs recorded at founding
# so the provenance chain (nextcloud-access-broker -> groupware-access-broker
# -> access-broker-core) is documented before the repo goes public.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["access_broker_core"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PL"]
ignore = [
    "PLR0913",  # many-argument signatures are expected in wiring code
    "PLR0917",  # many-positional-arguments: same rationale (ported audit API)
    "PLR0912",  # check()'s stage ladder is the wall; branching is the design
    "PLR0911",  # same: one return per deny reason
    "PLR0915",  # same: stage-per-branch evaluation
    "C901",     # check() complexity IS the exhaustive fail-closed design
    "PLW0603",  # the test batteries' registry singletons are test fixtures
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004",  # magic values in test assertions
    "ARG001",   # fixture args
    "ARG002",   # fake-connection stub methods mirror the real signature
    "PLC0415",  # in-test imports keep batteries explicit
    "E501",     # long assert-and-call lines are the exhaustive-test idiom
    "C416",     # deliberate set comprehension for the missing-reasons check
    "PLW0108",  # lambda wrappers read better in strategy maps
    "N802",     # ported battery helper names (grant/request) are the contract
    "F811",     # battery redefinitions are section organization
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]